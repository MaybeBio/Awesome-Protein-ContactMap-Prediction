<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protein Contact-Map Prediction Tools — Timeline</title>
<style>
  :root {
    --cat-a: #4a90d9;
    --cat-b: #e67e22;
    --cat-c: #2ecc71;
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-light: #6c757d;
    --border: #dee2e6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }
  header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
  header p  { font-size: 0.95rem; opacity: .75; margin-top: .25rem; }

  /* ── Legend / filter bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .75rem;
    padding: 1.25rem 1rem;
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .4rem 1rem;
    border-radius: 999px;
    border: 2px solid transparent;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    background: #f0f0f0;
    color: var(--text);
  }
  .filter-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .filter-btn .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .filter-btn.active-a { border-color: var(--cat-a); background: rgba(74,144,217,.12); }
  .filter-btn.active-b { border-color: var(--cat-b); background: rgba(230,126,34,.12); }
  .filter-btn.active-c { border-color: var(--cat-c); background: rgba(46,204,113,.12); }
  .filter-btn.active-all { border-color: #333; background: #e8e8e8; }
  .filter-btn .count {
    font-weight: 400;
    opacity: .5;
    font-size: .75rem;
  }

  /* ── Timeline container ── */
  .tl-wrapper {
    overflow-x: auto;
    overflow-y: visible;
    padding: 2rem 1rem 4rem;
    min-height: calc(100vh - 160px);
    cursor: grab;
  }
  .tl-wrapper:active { cursor: grabbing; }
  .tl-wrapper::-webkit-scrollbar { height: 10px; }
  .tl-wrapper::-webkit-scrollbar-track  { background: #e9ecef; border-radius: 5px; }
  .tl-wrapper::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 5px; }

  .tl {
    position: relative;
    min-width: 3600px; /* wide enough for ~40 tools */
    padding: 0 60px;
    user-select: none;
  }

  /* ── The track line ── */
  .tl-track {
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .tl-track-progress {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--cat-a), var(--cat-b), var(--cat-c));
    border-radius: 2px;
    transition: width .35s ease;
  }

  /* ── Year labels ── */
  .tl-years {
    position: relative;
    height: 40px;
    margin-bottom: 1rem;
  }
  .tl-year {
    position: absolute;
    top: 0;
    font-size: .8rem;
    color: var(--text-light);
    font-weight: 600;
    transform: translateX(-50%);
  }
  .tl-year::after {
    content: '';
    display: block;
    width: 1px; height: 16px;
    background: var(--border);
    margin: 4px auto 0;
  }

  /* ── Items row ── */
  .tl-items {
    position: relative;
    height: 380px;
  }

  /* ── Single tool card ── */
  .tl-item {
    position: absolute;
    top: 0;
    width: 160px;
    transform: translateX(-50%);
    transition: opacity .35s ease, transform .35s ease;
    cursor: default;
  }
  .tl-item.hidden {
    opacity: 0 !important;
    pointer-events: none;
    transform: translateX(-50%) scale(.85) !important;
  }

  .tl-card {
    background: var(--card-bg);
    border-radius: 10px;
    padding: .65rem .7rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
    border-left: 4px solid #ccc;
    transition: box-shadow .2s;
    min-height: 85px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tl-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,.13);
  }
  .tl-card .name {
    font-size: .82rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: .25rem;
  }
  .tl-card .journal {
    font-size: .7rem;
    color: var(--text-light);
    line-height: 1.3;
  }
  .tl-card .year-badge {
    display: inline-block;
    font-size: .65rem;
    font-weight: 700;
    padding: .1rem .45rem;
    border-radius: 4px;
    color: #fff;
    align-self: flex-start;
    margin-top: .35rem;
  }

  /* ── Connector line: card → track ── */
  .tl-item .connector {
    position: absolute;
    left: 50%;
    width: 2px;
    background: var(--border);
    transform: translateX(-50%);
  }

  /* Staggered layout — half above, half below the track */
  .tl-item.above { top: 10px; }
  .tl-item.below { top: 210px; }
  .tl-item.above .connector { bottom: -66px; height: 66px; }
  .tl-item.below .connector { top: -66px; height: 66px; }

  /* ── Category A ── */
  .cat-a .tl-card { border-left-color: var(--cat-a); }
  .cat-a .year-badge { background: var(--cat-a); }

  /* ── Category B ── */
  .cat-b .tl-card { border-left-color: var(--cat-b); }
  .cat-b .year-badge { background: var(--cat-b); }

  /* ── Category C ── */
  .cat-c .tl-card { border-left-color: var(--cat-c); }
  .cat-c .year-badge { background: var(--cat-c); }

  /* ── Tooltip / detail popup ── */
  .tl-tooltip {
    display: none;
    position: fixed;
    z-index: 200;
    background: #fff;
    border-radius: 10px;
    padding: .9rem 1rem;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    max-width: 340px;
    font-size: .8rem;
    line-height: 1.45;
    pointer-events: none;
  }
  .tl-tooltip.show { display: block; }
  .tl-tooltip .tt-name {
    font-weight: 700;
    font-size: .95rem;
    margin-bottom: .25rem;
  }
  .tl-tooltip .tt-field {
    margin-top: .1rem;
  }
  .tl-tooltip .tt-field strong { color: var(--text-light); }

  /* ── Empty state ── */
  .empty-state {
    display: none;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-light);
    font-size: 1.1rem;
  }
  .empty-state.visible { display: block; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.3rem; }
    .filter-btn { font-size: .75rem; padding: .3rem .7rem; }
    .tl-item { width: 130px; }
    .tl-card .name { font-size: .72rem; }
  }
</style>
</head>

// ── Derived ──
const yearMin = 2017;
const yearMax = 2026;
const yearSpan = yearMax - yearMin;
const PX_PER_YEAR = 320;

// ── Build year labels ──
(function buildYears() {
  const container = document.getElementById('tlYears');
  for (let y = yearMin; y <= yearMax; y++) {
    const el = document.createElement('div');
    el.className = 'tl-year';
    el.style.left = xPos(y) + 'px';
    el.textContent = y;
    container.appendChild(el);
  }
})();

// ── Helper ──
function xPos(year) {
  return ((year - yearMin) / yearSpan) * ((yearSpan) * PX_PER_YEAR) + 60;
}

// ── Render items ──
let above = true;
const catCounts = { A:0, B:0, C:0 };

tools.forEach((t, i) => {
  const el = document.createElement('div');
  el.className = `tl-item cat-${t.cat.toLowerCase()} ${above ? 'above' : 'below'}`;
  el.dataset.cat = t.cat;
  el.style.left = xPos(t.year) + 'px';
  // stagger items in the same year slightly
  const sameYear = tools.filter(x => x.year === t.year);
  if (sameYear.length > 1) {
    const idx = sameYear.indexOf(t);
    const offset = idx - (sameYear.length - 1) / 2;
    el.style.left = (xPos(t.year) + offset * 30) + 'px';
  }

  el.innerHTML = `
    <div class="connector"></div>
    <div class="tl-card">
      <div class="name">${t.name}</div>
      <div class="journal">${t.journal}</div>
      <span class="year-badge">${t.year}</span>
    </div>`;

  el.addEventListener('mouseenter', showTooltip.bind(null, t, el));
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('mousemove', moveTooltip);

  document.getElementById('tlItems').appendChild(el);
  above = !above;
  catCounts[t.cat] = (catCounts[t.cat] || 0) + 1;
});

// ── Counts ──
document.getElementById('countAll').textContent = tools.length;
document.getElementById('countA').textContent = tools.filter(t => t.cat === 'A').length;
document.getElementById('countB').textContent = tools.filter(t => t.cat === 'B').length;
document.getElementById('countC').textContent = tools.filter(t => t.cat === 'C').length;

// ── Filtering ──
const filterBtns = document.querySelectorAll('[data-filter]');
let activeFilter = 'all';
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    activeFilter = f;
    filterBtns.forEach(b => b.className = 'filter-btn');
    if (f === 'all') btn.classList.add('active-all');
    else btn.classList.add('active-' + f.toLowerCase());

    let visibleCount = 0;
    document.querySelectorAll('.tl-item').forEach(el => {
      const match = f === 'all' || el.dataset.cat === f;
      el.classList.toggle('hidden', !match);
      if (match) visibleCount++;
    });

    document.getElementById('emptyState').classList.toggle('visible', visibleCount === 0);
  });
});

// ── Drag-to-scroll ──
let isDown = false, startX, scrollLeft;
const wrapper = document.getElementById('tlWrapper');
wrapper.addEventListener('mousedown', e => {
  isDown = true; startX = e.pageX - wrapper.offsetLeft; scrollLeft = wrapper.scrollLeft;
});
wrapper.addEventListener('mouseleave', () => { isDown = false; });
wrapper.addEventListener('mouseup', () => { isDown = false; });
wrapper.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  const x = e.pageX - wrapper.offsetLeft;
  wrapper.scrollLeft = scrollLeft - (x - startX);
});

// ── Tooltip ──
const tip = document.getElementById('tooltip');
function showTooltip(t, el, e) {
  tip.innerHTML = `
    <div class="tt-name">${t.name}</div>
    <div class="tt-field"><strong>Journal:</strong> ${t.journal} (${t.year})</div>
    <div class="tt-field"><strong>Category:</strong> ${t.cat} · ${t.sub.replace(/_/g, ' ')}</div>
    ${t.paper ? `<div class="tt-field"><strong>Paper:</strong> <a href="${t.paper}" target="_blank">${t.paper.replace(/^https?:\/\//,'').slice(0,45)}…</a></div>` : ''}
    ${t.code && t.code !== 'N/A' ? `<div class="tt-field"><strong>Code:</strong> <a href="${t.code}" target="_blank">repo</a></div>` : ''}
  `;
  tip.classList.add('show');
  positionTip(e);
}
function moveTooltip(e) { positionTip(e); }
function hideTooltip() { tip.classList.remove('show'); }
function positionTip(e) {
  const x = e.clientX + 16;
  const y = e.clientY + 16;
  const maxX = window.innerWidth - 360;
  const maxY = window.innerHeight - 200;
  tip.style.left = Math.min(x, maxX) + 'px';
  tip.style.top = Math.min(y, maxY) + 'px';
}

// ── Track progress ──
function updateProgress() {
  const sw = wrapper.scrollWidth - wrapper.clientWidth;
  const p = sw > 0 ? wrapper.scrollLeft / sw : 0;
  document.getElementById('trackProgress').style.width = (p * 100) + '%';
}
wrapper.addEventListener('scroll', updateProgress);
updateProgress();

// ── Auto-scroll to latest year ──
setTimeout(() => {
  wrapper.scrollLeft = wrapper.scrollWidth;
}, 200);
</script>

</body>
</html>
