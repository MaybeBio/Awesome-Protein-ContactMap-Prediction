<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protein Contact-Map Prediction Tools — Timeline</title>
<style>
  :root {
    --cat-as: #3a7bd5;
    --cat-ae: #7bafd4;
    --cat-b: #e67e22;
    --cat-c: #2ecc71;
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-light: #6c757d;
    --border: #dee2e6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }

  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 2rem 1.5rem 1.5rem; text-align: center;
  }
  header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
  header p  { font-size: 0.95rem; opacity: .75; margin-top: .25rem; }

  .filter-bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem;
    padding: 1rem; background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .filter-btn {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .35rem .9rem; border-radius: 999px;
    border: 2px solid transparent;
    font-size: .82rem; font-weight: 600; cursor: pointer;
    transition: all .2s; background: #f0f0f0; color: var(--text);
  }
  .filter-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .filter-btn .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .filter-btn.active-all   { border-color: #333; background: #e8e8e8; }
  .filter-btn.active-as    { border-color: var(--cat-as); background: rgba(58,123,213,.12); }
  .filter-btn.active-ae    { border-color: var(--cat-ae); background: rgba(123,175,212,.12); }
  .filter-btn.active-b     { border-color: var(--cat-b);  background: rgba(230,126,34,.12); }
  .filter-btn.active-c     { border-color: var(--cat-c);  background: rgba(46,204,113,.12); }
  .filter-btn .count { font-weight: 400; opacity: .5; font-size: .72rem; }
  .filter-bar .sep { width: 1px; background: var(--border); align-self: stretch; }

  .tl-wrapper {
    overflow-x: auto; overflow-y: hidden;
    padding: 1.5rem 1rem 3rem;
    min-height: calc(100vh - 160px);
    cursor: grab;
  }
  .tl-wrapper:active { cursor: grabbing; }
  .tl-wrapper::-webkit-scrollbar { height: 10px; }
  .tl-wrapper::-webkit-scrollbar-track  { background: #e9ecef; border-radius: 5px; }
  .tl-wrapper::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 5px; }

  .tl { position: relative; min-width: 3600px; padding: 0 60px; user-select: none; }

  /* The horizontal track line */
  .tl-track {
    position: absolute; left: 0; right: 0;
    height: 4px; background: var(--border); border-radius: 2px;
    pointer-events: none; z-index: 1;
  }
  .tl-track-progress {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--cat-as), var(--cat-ae), var(--cat-b), var(--cat-c));
    border-radius: 2px; transition: width .35s ease;
  }

  .tl-years { position: relative; height: 36px; margin-bottom: .5rem; }
  .tl-year {
    position: absolute; top: 0;
    font-size: .78rem; color: var(--text-light); font-weight: 600;
    transform: translateX(-50%);
  }
  .tl-year::after {
    content: ''; display: block;
    width: 1px; height: 14px; background: var(--border); margin: 3px auto 0;
  }

  .tl-items { position: relative; }

  .tl-item {
    position: absolute; width: 148px;
    transform: translateX(-50%);
    transition: opacity .35s ease, transform .35s ease;
    cursor: default; z-index: 2;
  }
  .tl-item.hidden {
    opacity: 0 !important; pointer-events: none;
    transform: translateX(-50%) scale(.85) !important;
  }

  .tl-card {
    background: var(--card-bg); border-radius: 7px;
    padding: .32rem .5rem; box-shadow: 0 2px 7px rgba(0,0,0,.06);
    border-left: 3px solid #ccc;
    transition: box-shadow .2s;
    font-size: .72rem; line-height: 1.22;
  }
  .tl-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .tl-card .name { font-size: .73rem; font-weight: 700; line-height: 1.15; margin-bottom: .08rem; }
  .tl-card .meta { font-size: .62rem; color: var(--text-light); line-height: 1.2; }
  .tag-dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
  .tag-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .tl-card .year-badge {
    display: inline-block; font-size: .58rem; font-weight: 700;
    padding: .04rem .32rem; border-radius: 3px; color: #fff; margin-top: .15rem;
  }

  /* Connector from card edge to track */
  .tl-item .connector {
    position: absolute; left: 50%; width: 1.5px;
    background: var(--border); transform: translateX(-50%);
    pointer-events: none;
  }

  .cat-as .tl-card { border-left-color: var(--cat-as); }
  .cat-as .year-badge { background: var(--cat-as); }
  .cat-ae .tl-card { border-left-color: var(--cat-ae); }
  .cat-ae .year-badge { background: var(--cat-ae); }
  .cat-b  .tl-card { border-left-color: var(--cat-b); }
  .cat-b  .year-badge { background: var(--cat-b); }
  .cat-c  .tl-card { border-left-color: var(--cat-c); }
  .cat-c  .year-badge { background: var(--cat-c); }

  .tl-tooltip {
    display: none; position: fixed; z-index: 200;
    background: #fff; border-radius: 10px;
    padding: .9rem 1rem; box-shadow: 0 8px 30px rgba(0,0,0,.18);
    max-width: 340px; font-size: .8rem; line-height: 1.45;
    pointer-events: none;
  }
  .tl-tooltip.show { display: block; }
  .tl-tooltip .tt-name { font-weight: 700; font-size: .95rem; margin-bottom: .25rem; }
  .tl-tooltip .tt-field { margin-top: .1rem; }
  .tl-tooltip .tt-field strong { color: var(--text-light); }
  .tl-tooltip .tt-sub {
    display: inline-block; font-size: .65rem; font-weight: 600;
    padding: .1rem .45rem; border-radius: 4px; color: #fff; margin-top: .2rem;
  }

  .empty-state {
    display: none; text-align: center; padding: 4rem 2rem;
    color: var(--text-light); font-size: 1.1rem;
  }
  .empty-state.visible { display: block; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.3rem; }
    .filter-btn { font-size: .72rem; padding: .3rem .7rem; }
    .tl-item { width: 120px; }
    .tl-card .name { font-size: .65rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Protein Contact-Map Prediction Tools</h1>
  <p>Timeline of methods organized by category</p>
</header>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active-all" data-filter="all">
    <span class="dot" style="background:#555;"></span> All <span class="count" id="countAll"></span>
  </button>
  <div class="sep"></div>
  <button class="filter-btn" data-filter="as">
    <span class="dot" style="background:var(--cat-as);"></span> A · single-structure <span class="count" id="countAs"></span>
  </button>
  <button class="filter-btn" data-filter="ae">
    <span class="dot" style="background:var(--cat-ae);"></span> A · ensemble <span class="count" id="countAe"></span>
  </button>
  <div class="sep"></div>
  <button class="filter-btn" data-filter="B">
    <span class="dot" style="background:var(--cat-b);"></span> B · sequence-based <span class="count" id="countB"></span>
  </button>
  <button class="filter-btn" data-filter="C">
    <span class="dot" style="background:var(--cat-c);"></span> C · IDR-specific <span class="count" id="countC"></span>
  </button>
</div>

<div class="tl-wrapper" id="tlWrapper">
  <div class="tl" id="tl">
    <div class="tl-track" id="tlTrack"><div class="tl-track-progress" id="trackProgress"></div></div>
    <div class="tl-years" id="tlYears"></div>
    <div class="tl-items" id="tlItems"></div>
  </div>
  <div class="empty-state" id="emptyState">No tools match the selected filter.</div>
</div>

<div class="tl-tooltip" id="tooltip"></div>

<script>
const tools = [
  { id:'AF2',         name:'AlphaFold2',          sub:'as', journal:'Nature',                     year:2021 },
  { id:'AF3',         name:'AlphaFold3',          sub:'as', journal:'Nature',                     year:2024 },
  { id:'AF-Multimer', name:'AlphaFold-Multimer',  sub:'as', journal:'bioRxiv',                    year:2022 },
  { id:'ColabFold',   name:'ColabFold',           sub:'as', journal:'Nature Methods',             year:2022 },
  { id:'ESMFold',     name:'ESMFold',             sub:'as', journal:'Science',                    year:2023 },
  { id:'ESMFold2',    name:'ESMFold2',            sub:'as', journal:'bioRxiv',                    year:2026 },
  { id:'RoseTTAFold', name:'RoseTTAFold',         sub:'as', journal:'Science',                    year:2021 },
  { id:'RF2',         name:'RoseTTAFold2',        sub:'as', journal:'bioRxiv',                    year:2023 },
  { id:'RF2NA',       name:'RoseTTAFold2NA',      sub:'as', journal:'Nature Methods',             year:2023 },
  { id:'RF3',         name:'RoseTTAFold3',        sub:'as', journal:'bioRxiv',                    year:2025 },
  { id:'OpenFold',    name:'OpenFold',            sub:'as', journal:'Nature Methods',             year:2024 },
  { id:'UniFold',     name:'Uni-Fold',            sub:'as', journal:'bioRxiv',                    year:2022 },
  { id:'OmegaFold',   name:'OmegaFold',           sub:'as', journal:'bioRxiv',                    year:2022 },
  { id:'EquiFold',    name:'EquiFold',            sub:'as', journal:'bioRxiv',                    year:2023 },
  { id:'RF-AA',       name:'RoseTTAFold All-Atom',sub:'as', journal:'Science',                    year:2024 },
  { id:'Boltz',       name:'Boltz family',        sub:'as', journal:'bioRxiv',                    year:2025 },
  { id:'Chai1',       name:'Chai-1',              sub:'as', journal:'bioRxiv',                    year:2024 },
  { id:'Chai2',       name:'Chai-2',              sub:'as', journal:'bioRxiv',                    year:2025 },
  { id:'HelixFold',   name:'HelixFold',           sub:'as', journal:'arXiv',                      year:2022 },
  { id:'HelixFold-S', name:'HelixFold-Single',    sub:'as', journal:'arXiv',                      year:2023 },
  { id:'HelixFold-M', name:'HelixFold-Multimer',  sub:'as', journal:'arXiv',                      year:2024 },
  { id:'HelixFold3',  name:'HelixFold3',          sub:'as', journal:'arXiv',                      year:2024 },
  { id:'ProtenixMini',name:'Protenix-Mini',       sub:'as', journal:'arXiv',                      year:2025 },
  { id:'Protenix',    name:'Protenix',            sub:'as', journal:'bioRxiv',                    year:2025 },
  { id:'Protenix-v1', name:'Protenix-v1',         sub:'as', journal:'bioRxiv',                    year:2026 },
  { id:'Protenix-v2', name:'Protenix-v2',         sub:'as', journal:'bioRxiv',                    year:2026 },

  { id:'AlphaFlow',   name:'AlphaFlow/ESMFlow',    sub:'ae', journal:'arXiv',                         year:2024 },
  { id:'BioEmu',      name:'BioEmu',              sub:'ae', journal:'Science',                        year:2025 },
  { id:'PhantoIDP',   name:'Phanto-IDP',          sub:'ae', tags:['C'], journal:'Briefings in Bioinformatics',     year:2024 },
  { id:'IDPFold',     name:'IDPFold',             sub:'ae', tags:['C'], journal:'Advanced Science',               year:2025 },
  { id:'IDPFold2',    name:'IDPFold2',            sub:'ae', tags:['C'], journal:'bioRxiv',                        year:2026 },
  { id:'STARLING',    name:'STARLING',            sub:'ae', tags:['C'], journal:'Nature',                         year:2026 },
  { id:'IDP-LZerD',   name:'IDP-LZerD',           sub:'ae', tags:['C'], journal:'PLOS Computational Biology',     year:2017 },
  { id:'IDPForge',    name:'IDPForge',            sub:'ae', tags:['C'], journal:'bioRxiv',                        year:2026 },
  { id:'AlphaFlex',   name:'AlphaFlex',           sub:'ae', tags:['C'], journal:'bioRxiv',                        year:2026 },
  { id:'IdpSAM',      name:'IdpSAM',              sub:'ae', tags:['C'], journal:'PLOS Computational Biology',     year:2024 },
  { id:'IDP-o',       name:'IDP-o',               sub:'ae', tags:['C'], journal:'bioRxiv',                        year:2025 },
  { id:'PepTron',     name:'PepTron',             sub:'ae', tags:['C'], journal:'bioRxiv',                        year:2025 },

  { id:'FINCHES',      name:'FINCHES',             sub:'B', tags:['C'], journal:'Science',                       year:2025 },
  { id:'Disobind',     name:'Disobind',            sub:'B', tags:['C'], journal:'Cell Systems',                  year:2026 },
  { id:'DeepInteract', name:'DeepInteract',        sub:'B', journal:'arXiv',                          year:2022 },
  { id:'GLINTER',      name:'GLINTER',             sub:'B', journal:'Bioinformatics',                year:2021 },
  { id:'ComplexContact',name:'ComplexContact',     sub:'B', journal:'Nucleic Acids Research',        year:2018 },
  { id:'DRN1D2D',      name:'DRN-1D2D_Inter',      sub:'B', journal:'Briefings in Bioinformatics',   year:2023 },
  { id:'PLMGraph',     name:'PLMGraph-Inter',      sub:'B', journal:'eLife',                         year:2024 },
  { id:'DeepHomo',     name:'DeepHomo',            sub:'B', journal:'Briefings in Bioinformatics',   year:2021 },
  { id:'DeepHomo2',    name:'DeepHomo2',           sub:'B', journal:'Briefings in Bioinformatics',   year:2022 },
  { id:'CDPred',       name:'CDPred',              sub:'B', journal:'Nature Communications',         year:2022 },
  { id:'RaptorX',      name:'RaptorX-Contact',     sub:'B', journal:'PROTEINS / PNAS',               year:2017 },
  { id:'ESMDynamic',   name:'ESMDynamic',          sub:'B', journal:'bioRxiv',                       year:2026 },
  { id:'bAIes',        name:'bAIes',               sub:'B', tags:['C'], journal:'Nature Communications',         year:2026 },
];

const yearMin = 2017, yearMax = 2026;
const PX_PER_YEAR = 320;

// Sort tools by subcategory then by name within each year for cleaner grouping
tools.sort((a, b) => {
  if (a.year !== b.year) return a.year - b.year;
  const subOrder = { as:0, ae:1, B:2, C:3 };
  return (subOrder[a.sub]||0) - (subOrder[b.sub]||0) || a.name.localeCompare(b.name);
});

// ── Layout params ──
const CARD_H = 59;    // compact card height
const CARD_GAP = 3;   // vertical gap
const TOP_PAD = 16;   // padding above topmost card
const BOT_PAD = 16;

// Group tools by year
const yearGroups = {};
tools.forEach(t => {
  if (!yearGroups[t.year]) yearGroups[t.year] = [];
  yearGroups[t.year].push(t);
});

// Max above/below count across all years
let maxAbove = 0, maxBelow = 0;
Object.values(yearGroups).forEach(group => {
  const a = Math.ceil(group.length / 2);
  const b = group.length - a;
  if (a > maxAbove) maxAbove = a;
  if (b > maxBelow) maxBelow = b;
});

// Compute track Y position so track is centered in the card stack
const TRACK_Y = TOP_PAD + maxAbove * (CARD_H + CARD_GAP);
const totalH = TRACK_Y + CARD_GAP + maxBelow * (CARD_H + CARD_GAP) + BOT_PAD;

document.getElementById('tlItems').style.height = totalH + 'px';
document.getElementById('tlTrack').style.top = TRACK_Y + 'px';

// ── Year labels ──
(function () {
  const c = document.getElementById('tlYears');
  for (let y = yearMin; y <= yearMax; y++) {
    const el = document.createElement('div');
    el.className = 'tl-year';
    el.style.left = xPos(y) + 'px';
    el.textContent = y;
    c.appendChild(el);
  }
})();

function xPos(year) { return ((year - yearMin) / (yearMax - yearMin)) * ((yearMax - yearMin) * PX_PER_YEAR) + 60; }

// ── Category labels / colors ──
const subLabel = { 'as':'A · Single structure','ae':'A · Ensemble','B':'B · Sequence-based','C':'C · IDR-specific' };
const subColor = { 'as':'var(--cat-as)','ae':'var(--cat-ae)','B':'var(--cat-b)','C':'var(--cat-c)' };

// ── Render all items ──
const catCounts = { as:0, ae:0, B:0, C:0 };

tools.forEach((t, i) => {
  const group = yearGroups[t.year];
  const totalN = group.length;
  const idx = group.indexOf(t);
  const aboveN = Math.ceil(totalN / 2);

  // Vertical position: alternate above/below, closest to track first
  let top, connectorTop, connectorH;
  if (idx < aboveN) {
    const depth = aboveN - idx; // 1=closest to track
    top = TRACK_Y - depth * (CARD_H + CARD_GAP);
    connectorTop = top + CARD_H;
    connectorH = depth * (CARD_H + CARD_GAP) - CARD_H;
  } else {
    const depth = idx - aboveN;
    top = TRACK_Y + CARD_GAP + depth * (CARD_H + CARD_GAP);
    connectorTop = TRACK_Y;
    connectorH = CARD_GAP + depth * (CARD_H + CARD_GAP);
  }

  // Horizontal: slight fan-out for same-year tools, grouped by subcategory
  const subOrder = { as:0, ae:1, B:2, C:3 };
  const sameSub = group.filter(g => g.sub === t.sub);
  const subIdx = sameSub.indexOf(t);
  const subOffset = sameSub.length > 1 ? (subIdx - (sameSub.length - 1) / 2) * 22 : 0;
  const left = xPos(t.year) + subOffset;

  const cls = (t.sub === 'as' || t.sub === 'ae') ? 'cat-' + t.sub : 'cat-' + t.sub.toLowerCase();
  const el = document.createElement('div');
  el.className = `tl-item ${cls}`;
  el.dataset.sub = t.sub;
  if (t.tags) el.dataset.tags = t.tags.join(',');
  el.style.left = left + 'px';
  el.style.top = top + 'px';

  const tagDots = (t.tags || []).map(tg =>
    `<span class="tag-dot" style="background:var(--cat-${tg.toLowerCase()})" title="${subLabel[tg]||tg}"></span>`
  ).join('');

  el.innerHTML = `
    <div class="connector" style="top:${connectorTop}px;height:${connectorH}px;"></div>
    <div class="tl-card">
      <div class="name">${t.name}${tagDots ? ' <span class="tag-dots">'+tagDots+'</span>' : ''}</div>
      <div class="meta">${t.journal}</div>
      <span class="year-badge">${t.year}</span>
    </div>`;

  el.addEventListener('mouseenter', e => showTooltip(t, el, e));
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('mousemove', moveTooltip);

  document.getElementById('tlItems').appendChild(el);
  catCounts[t.sub] = (catCounts[t.sub] || 0) + 1;
});

// ── Counts ──
document.getElementById('countAll').textContent = tools.length;
document.getElementById('countAs').textContent = tools.filter(t => t.sub === 'as').length;
document.getElementById('countAe').textContent = tools.filter(t => t.sub === 'ae').length;
document.getElementById('countB').textContent = tools.filter(t => t.sub === 'B').length;
document.getElementById('countC').textContent = tools.filter(t => t.sub === 'C' || (t.tags||[]).includes('C')).length;

// ── Filtering ──
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.className = 'filter-btn');
    if (f === 'all') btn.classList.add('active-all');
    else btn.classList.add('active-' + f.toLowerCase());

    let visible = 0;
    document.querySelectorAll('.tl-item').forEach(el => {
      let match = f === 'all' || el.dataset.sub === f;
      if (!match && el.dataset.tags) {
        match = el.dataset.tags.split(',').includes(f);
      }
      el.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    document.getElementById('emptyState').classList.toggle('visible', visible === 0);
  });
});

// ── Drag to scroll ──
let isDown = false;
const wrapper = document.getElementById('tlWrapper');
wrapper.addEventListener('mousedown', () => { isDown = true; });
wrapper.addEventListener('mouseleave', () => { isDown = false; });
wrapper.addEventListener('mouseup',   () => { isDown = false; });
wrapper.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  wrapper.scrollLeft -= e.movementX;
});

// ── Tooltip ──
const tip = document.getElementById('tooltip');
function showTooltip(t, el, e) {
  const tags = (t.tags || []).map(tg =>
    `<span class="tt-sub" style="background:${subColor[tg]||'#999'}">${subLabel[tg]||tg}</span>`
  ).join(' ');
  tip.innerHTML = `
    <div class="tt-name">${t.name}</div>
    <div class="tt-field"><strong>Journal:</strong> ${t.journal} (${t.year})</div>
    <div class="tt-field">
      <span class="tt-sub" style="background:${subColor[t.sub]||'#999'}">${subLabel[t.sub]||t.sub}</span>
      ${tags ? ' ' + tags : ''}
    </div>`;
  tip.classList.add('show');
  positionTip(e);
}
function moveTooltip(e) { positionTip(e); }
function hideTooltip() { tip.classList.remove('show'); }
function positionTip(e) {
  tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 360) + 'px';
  tip.style.top = Math.min(e.clientY + 16, window.innerHeight - 200) + 'px';
}

// ── Track progress indicator ──
function updateProgress() {
  const sw = wrapper.scrollWidth - wrapper.clientWidth;
  document.getElementById('trackProgress').style.width = (sw > 0 ? wrapper.scrollLeft / sw : 0) * 100 + '%';
}
wrapper.addEventListener('scroll', updateProgress);
updateProgress();

setTimeout(() => { wrapper.scrollLeft = wrapper.scrollWidth; }, 200);
</script>
</body>
</html>
